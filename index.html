<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кросс-цели от лица руководителя — интерактивный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Токены сняты напрямую с макетов Figma (секция «от лица руководителя») */
:root{
  /* палитра и типографика — по справочнику UI-kit OTP (стр. Colors 6:364, Typography 1:14) */
  --bg:#FFFFFF; --surface:#FFFFFF; --bg-list:#F6F7FA; --bg-panel:#F4F6F9;
  --gray2:#E3E8F1; --line:#ECEFF6; --line-strong:#D0D8E8; --disabled-bg:#F2F2F2;
  --text:#222222; --text-2:#525252; --text-3:#7D828B; --text-4:#717171; --head:#151617; --text-dis:#ABABAB;
  --accent:#A06EC5; --accent-l:#BE8AE4; --accent-soft:#F2E9F8; --accent-line:#DFC9EE;
  --lime:#CDFC68; --lime-soft:#E5FBCC; --green:#52AE30;
  --blue-soft:#D7E5FC; --blue:#1B82E3; --edu-soft:#E8F3FC;
  --danger:#FF435A; --danger-soft:#FFF0E6;
  --warn:#F47332; --warn-soft:#FFF0E6;
  --ok:#52AE30; --ok-soft:#EEF7EA;
  /* типографический рамп кита */
  --t-h1:34px/40px; --t-h3:22px/32px; --t-body1:18px/24px; --t-body2:18px/20px;
  --t-sm1:16px/20px; --t-sm2:16px/18px; --t-hint:14px/16px;
  --dark:#222222;
  --r:12px; --r-lg:12px; --r-xl:24px; --r-pill:20px;
  --shadow:0 12px 40px rgba(21,22,23,.16);
  --font:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 18px}
.brand i{display:inline-block;width:30px;height:18px;border-radius:4px;background:var(--lime)}
.brand span{font-weight:700;letter-spacing:-.2px}
.nav{display:block;padding:9px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:#F6F7F9}
.nav.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--text-2)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px}
.wrap{padding:22px 28px 60px;max-width:1360px;width:100%}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--text-2)}
.small{font-size:12px}
.b{font-weight:600}
h2{font-size:17px;margin:0 0 4px}
.hr{height:1px;background:var(--line);margin:16px 0}

.btn{border:1px solid transparent;border-radius:9px;padding:10px 16px;background:var(--dark);color:#fff;font-weight:600;font-size:13px}
.btn:hover{background:#2c2f36}
.btn[disabled]{background:#E9EAEE;color:#A6ACB6;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--line-strong)}
.btn.sec:hover{background:#F6F7F9}
.btn.sec[disabled]{color:#B5BAC3;background:var(--surface);border-color:var(--line)}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#cf3b40}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.link{background:none;color:var(--accent);border:0;padding:4px 2px;font-weight:600}
.btn.link:hover{background:none;text-decoration:underline}
.icob{border:0;background:none;padding:6px;border-radius:7px;color:var(--text-3);line-height:0}
.icob:hover{background:#F2F3F5;color:var(--text)}
.icob.danger:hover{background:var(--danger-soft);color:var(--danger)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.dan{background:var(--danger-soft);color:var(--danger)}
.tag.grey{background:#F1F2F4;color:var(--text-2)}

/* ---------- stages ---------- */
.stages{display:flex;gap:26px;align-items:flex-start;padding:14px 18px;flex-wrap:wrap}
.stage{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text-3)}
.stage b{display:block;color:var(--text-3);font-weight:600;font-size:13px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);margin-top:2px;flex:0 0 14px}
.stage.on b{color:var(--text)}
.stage.on{color:var(--text-2)}
.stage.on .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 46%)}
.due{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700;margin-bottom:5px}

/* ---------- goals table ---------- */
.thead{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2);font-weight:600}
.gcell-w{width:120px;flex:0 0 120px}
.gcell-a{width:104px;flex:0 0 104px;text-align:right}
.grow{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow .ttl{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column;gap:6px}
.grow .ttl em{font-style:normal;font-weight:400;color:var(--text-2);font-size:12.5px}
.chev{border:0;background:none;color:var(--text-3);padding:2px 4px;line-height:0}
.gopen{background:#FBFBFC}
.wbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;width:170px}
.wbar i{display:block;height:100%;background:var(--accent)}
.wbar.full i{background:var(--lime)}
.wbar.over i{background:var(--danger)}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;padding:6px 18px 22px;background:#FBFBFC;border-bottom:1px solid var(--line)}
.fld{margin-bottom:14px}
.fld .lb{font-size:12px;color:var(--text-2);margin-bottom:3px}
.fld .vl{white-space:pre-wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 3px;font-size:14.5px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F1F2F4}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm span{font-size:11.5px;color:var(--text-3)}
.wchip{background:#F1F2F4;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600;min-width:46px;text-align:center}

/* ---------- form ---------- */
.form{max-width:980px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.fl{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,78,227,.12)}
.inp[disabled]{background:#F4F5F7;color:var(--text-3)}
textarea.inp{min-height:96px;resize:vertical}
.field{margin-bottom:18px}
.field.bad .inp{border-color:var(--danger)}
.field.warnf .inp{border-color:var(--warn)}
.err{color:var(--danger);font-size:12px;margin-top:5px;display:flex;gap:6px}
.hint{color:var(--text-3);font-size:12px;margin-top:5px}
.cnt{font-size:11.5px;color:var(--text-3);margin-top:5px;text-align:right}
.cnt.bad{color:var(--danger)}
.cnt.warnf{color:var(--warn)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{margin:2px 0 0;accent-color:var(--accent);width:16px;height:16px}
.chk.off{opacity:.45;cursor:not-allowed}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,16,20,.42);display:grid;place-items:center;padding:24px;z-index:50}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px}
.modal.wide{max-width:900px}
.modal h2{font-size:18px;margin:0 0 10px;padding-right:30px}
.mclose{position:absolute;top:0;right:0}
.mhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.opt{border:1px solid var(--line-strong);border-radius:12px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--accent-line);background:#FBFAFF}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.dis{opacity:.5;cursor:not-allowed;background:#F7F8F9}
.opt input{margin-top:2px;accent-color:var(--accent)}
.opt b{display:block;font-size:13.5px}
.opt span{font-size:12.5px;color:var(--text-2)}

/* ---------- toast / banner ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--dark);color:#fff;border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;min-width:320px;animation:pop .18s ease-out}
.toast.ok{background:#1E7A46}
.toast.dan{background:#B5353A}
.toast button{background:none;border:0;color:#fff;text-decoration:underline;font-weight:600;font-size:13px;padding:0}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;background:var(--warn-soft);color:#7A4A05;font-size:13px;margin-bottom:14px}
.banner.info{background:var(--accent-soft);color:#3D2C8A}
.banner.dan{background:var(--danger-soft);color:#8E2226}

.logl{font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.logl:last-child{border-bottom:0}
.logl time{color:var(--text-3);flex:0 0 74px}

.empty{text-align:center;padding:52px 20px;color:var(--text-2)}
.empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}

/* ===================== слой соответствия макетам Figma ===================== */
body{font-size:16px;line-height:1.25;background:#fff}
.app{background:#fff}
.side{width:256px;flex:0 0 256px;padding:20px 12px}
.brand{padding:4px 12px 22px}

.brand span{font-size:18px}

.nav:hover{background:var(--bg-list)}
.nav.on{background:var(--bg-list);color:var(--text);font-weight:600}
.top{padding:20px 32px 4px;border-bottom:0;background:#fff}
.top h1{font-size:30px;line-height:34px;color:var(--head);font-weight:700;letter-spacing:-.3px}
/* правая группа хедера — кадр 11771:254845 */
.who{display:flex;align-items:center;gap:24px}
.hicon{border:0;background:none;padding:0;width:24px;height:24px;color:var(--text);line-height:0;cursor:pointer}
.hicon:hover{color:var(--accent)}
.hbell{position:relative;display:inline-flex}
.hbadge{position:absolute;left:15px;top:-7px;background:var(--accent);color:#fff;border-radius:16px;
  padding:2px 6px;font:600 14px/17px var(--font);min-width:21px;text-align:center}
.wrap{padding:4px 32px 72px;max-width:none}

.stagebar{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:8px 0 20px}
.qsel{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--text-2)}
.qsel .yr{font-weight:600;color:var(--text);margin-right:6px}
.qsel .q{padding:4px 2px 6px;display:inline-flex;align-items:center;gap:6px}
.qsel .q.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.chipq{font-size:13px;border-radius:20px;padding:1px 9px;background:var(--lime);color:var(--text);font-weight:400}
.chipq.p{background:var(--blue-soft)}
.stages{gap:34px;padding:0;margin-left:auto}
.stage{font-size:14px;color:var(--text-3)}
.stage b{font-size:16px;line-height:20px}
.due{background:var(--accent-soft);color:#6C3E90;font-size:13px;border-radius:20px;padding:2px 10px;font-weight:600}
.dot{width:16px;height:16px;flex:0 0 16px;border-width:2px}

.list{background:var(--bg-list);border-radius:var(--r-xl);padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.thead{border-bottom:0;padding:14px 20px 4px;font-size:14px;color:var(--text-2);font-weight:400}
.gcard{background:#fff;border-radius:12px;padding:0 20px}
.ghead{display:flex;align-items:center;gap:20px;min-height:74px}

.ghead .ttl .tags{display:flex;gap:6px;flex-wrap:wrap}

.tag.ok{background:var(--lime);color:var(--text)}
.tag.warn{background:var(--warn-soft);color:#A8420F}
.tag.dan{background:var(--warn-soft);color:#A8420F}

.tag.info{background:var(--blue-soft);color:#1F3C6B}
.wbar{width:150px;height:8px;border-radius:20px;background:#E6EAF2}
.wbar i{background:var(--accent)}
.wbar.full i{background:var(--lime)}
.wbar.over i{background:var(--warn)}

.detail{grid-template-columns:minmax(0,1fr) 600px;gap:32px;background:transparent;border-bottom:0;padding:4px 0 24px}
.panelwrap{background:var(--bg-panel);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:24px}
.panel{border:0;border-radius:12px;padding:20px;margin:0;background:#fff}

.fld .vl{font-size:16px}

.btn{border-radius:12px;height:48px;padding:0 20px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}

.inp{height:48px;border-radius:12px;border-color:var(--line-strong);padding:12px 16px;font-size:16px}

.ava.sys{background:var(--bg-list);color:var(--text-2);font-size:18px}

.prow .nm span{font-size:14px;color:var(--text-3)}
.wchip{background:var(--bg-list);border-radius:20px;font-size:14px;padding:3px 10px;min-width:52px}
.modal{border-radius:12px;padding:24px}
.modal h2{font-size:22px;line-height:30px}
.opt{border-radius:12px}
.opt b{font-size:16px}
.opt span{font-size:14px}
.toast{border-radius:12px;font-size:16px}
.banner{border-radius:12px;font-size:15px}
.empty b{font-size:22px}
.form{max-width:980px}
.formtitle{font-size:40px;line-height:44px;font-weight:700;color:var(--head);margin:4px 0 22px;letter-spacing:-.5px}
.backlink{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);background:none;border:0;padding:0;font-size:16px;margin-top:6px}
.backlink:hover{color:var(--text)}
.fcard{background:#fff;border-radius:12px;padding:0}
.totalrow{display:flex;align-items:center;gap:20px;background:var(--lime);border-radius:12px;padding:12px 20px;font-weight:600}

/* типографический рамп UI-kit: sm1 16/20 · sm2 16/18 · hint 14/16 · body1 18/24 · h3 22/32 */
body{font:400 16px/20px var(--font)}
label.fl{font:600 16px/18px var(--font)}
.btn{font:600 16px/18px var(--font)}
.btn.sm,.btn.link.sm{font:600 14px/16px var(--font)}
.btn.link{font:600 16px/20px var(--font)}
.inp{font:400 16px/20px var(--font)}
.panel h3{font:600 18px/24px var(--font)}
.modal h2{font:600 22px/32px var(--font)}
.hint,.cnt,.err,.fld .lb,.prow .nm span,.stage,.thead,.small,.opt span{font:400 14px/16px var(--font)}
.tag,.chipq,.wchip,.due{font:400 14px/16px var(--font)}
.due{font-weight:600}
.prow .nm b,.opt b{font:600 16px/20px var(--font)}
.stage b{font:600 16px/20px var(--font)}
.banner{font:400 16px/20px var(--font)}
.wbar{background:var(--gray2)}
/* алерт — лаймовая плашка 680x56 по кадру 11796:277614 */
.toasts{bottom:40px}
.toast{background:var(--lime);color:var(--head);border-radius:12px;font:400 16px/20px var(--font);
  min-width:680px;max-width:calc(100vw - 48px);min-height:56px;padding:8px 16px 8px 56px;
  gap:12px;box-shadow:0 8px 24px rgba(21,22,23,.14)}
.toast.ok{background:var(--lime);color:var(--head)}
.toast.dan{background:var(--warn-soft);color:#A8420F}
.toast .tmsg{flex:1;text-align:center}
.toast .tundo{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;font-size:15px;padding:0}
.toast .tx{background:none;border:0;color:inherit;padding:6px;line-height:0;border-radius:8px;opacity:.7}
.toast .tx:hover{opacity:1;background:rgba(21,22,23,.08)}

select.inp{appearance:none;-webkit-appearance:none;background-color:#fff;background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none'%3E%3Cpath d='M4 6l4 4 4-4' stroke='%237D828B' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;padding-right:46px}
select.inp:disabled{background-color:#F4F6F9}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:6px;background:#fff;position:relative;flex:0 0 20px;cursor:pointer;margin-top:1px}
.chk input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.chk input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk input[type=checkbox]:disabled{background:#F4F6F9;border-color:var(--line)}
.opt input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.ghead .ttl>span:first-child{font-weight:400}
.gcell-w b{font-weight:400;font-size:16px}

  if (!d.dos.trim()) e.dos = 'Заполни цель и ожидаемый результат';
  else if (d.dos.length > RULES.textMax) e.dos = `Превышено допустимое количество символов: ${d.dos.length} из ${RULES.textMax}`;

  if (!d.dod.trim()) e.dod = 'Заполни план действий';
  else if (d.dod.length > RULES.textMax) e.dod = `Превышено допустимое количество символов: ${d.dod.length} из ${RULES.textMax}`;

  const wRaw = String(d.weight).trim();
  const min = isX ? RULES.xWeightMin : RULES.weightMin;
  if (!wRaw) e.weight = 'Введи вес';
  else if (!/^\d+$/.test(wRaw)) e.weight = 'Доступен ввод только цифр';
  else {
    const w = Number(wRaw);
    if (w < min) e.weight = isX
      ? `Минимальный вес кросс-цели — ${RULES.xWeightMin}%`
      : `Минимальный вес цели — ${RULES.weightMin}%`;
    else if (w > RULES.weightMax) e.weight = `Максимальный вес цели — ${RULES.weightMax}%`;
    else {
      const others = S.goals.filter(g => g.id !== opts.excludeId).reduce((a, g) => a + Number(g.weight || 0), 0);
      if (others + w > RULES.cardTotal) e.weight = `Общий вес карты целей будет ${others + w}%. Максимум — ${RULES.cardTotal}%, свободно ${RULES.cardTotal - others}%`;
    }
  }

  if (!d.type) e.type = 'Выбери тип цели';
  if (d.type === 'quant') {
    const p = String(d.plan).trim();
    if (!p) e.plan = 'Введи план';
    else if (!/^-?\d+([.,]\d+)?$/.test(p)) e.plan = 'Доступен ввод только цифр и символов «,» «.»';
    else if (Number(p.replace(',', '.')) === 0) e.plan = RULES.planZeroError;
    if (!d.unit) e.unit = 'Выбери единицу измерения';
  }
  if (d.type === 'qual' && !d.scale.trim()) e.scale = 'Опиши шкалу выполнения цели';

  if (!d.priorities.length) e.priorities = 'Выбери стратегический приоритет';
  if (!d.period) e.period = 'Выбери период';
  if (isX && d.confidential) e.confidential = 'Признак «Конфиденциально» нельзя установить в кросс-цели';

  return e;
}

function wireCascade() {

/* ---------------- форма цели ---------------- */
function errorsFor(d) { return validate(d, {isX: d.isX, excludeId: d.editingId}); }
function showErr(d, name) { return (d.showAll || d.touched[name]) ? errorsFor(d)[name] : null; }

function counter(val, max) {
  const n = (val || '').length;
  if (n < max * 0.6) return '';
  const over = n > max;
  return `<div class="cnt ${over ? 'bad' : ''}">${n} / ${max}</div>`;
}

function field(d, name, label, inner, help) {
  const err = showErr(d, name);
  return `<div class="field ${err ? 'bad' : ''}" data-field="${name}">
    <label class="fl">${label}</label>${inner}
    <div class="slot">${err ? `<div class="err">${esc(err)}</div>` : (help ? `<div class="hint">${help}</div>` : '')}</div>
  </div>`;
}

function refreshField(name) {
  const d = S.draft;
  const wrap = document.querySelector(`[data-field="${name}"]`);
  if (!wrap) return;
  const err = showErr(d, name);
  wrap.classList.toggle('bad', !!err);
  const slot = wrap.querySelector('.slot');
  if (slot) {
    const help = wrap.dataset.help || '';
    slot.innerHTML = err ? `<div class="err">${esc(err)}</div>` : help;
  }
  const cnt = wrap.querySelector('.cnt');
  if (cnt) {
    const max = name === 'title' ? RULES.titleMax : RULES.textMax;
    const n = (d[name] || '').length;
    cnt.textContent = `${n} / ${max}`;
    cnt.classList.toggle('bad', n > max);
  }
}

function wireForm() {
  const root = document.getElementById('root');
  root.querySelectorAll('[data-field]').forEach(w => {
    const h = w.querySelector('.hint');
    if (h) w.dataset.help = h.outerHTML;
  });
  root.querySelectorAll('[data-f]').forEach(el => {
    const name = el.dataset.f;
    const ev = el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      S.draft[name] = el.type === 'checkbox' ? el.checked : el.value;
      S.draft.touched[name] = true;
      if (el.dataset.rerender) { render(); return; }
      refreshField(name);
      if (name === 'weight') refreshField('weight');
    });
  });
  root.querySelectorAll('[data-pri]').forEach(el => {
    el.addEventListener('change', () => {
      const p = el.dataset.pri, d = S.draft;
      if (el.checked) {
        if (p === PRIORITIES[0]) d.priorities = [PRIORITIES[0]];
        else d.priorities = d.priorities.filter(x => x !== PRIORITIES[0]).concat(p);
      } else d.priorities = d.priorities.filter(x => x !== p);
      d.touched.priorities = true;
      render();
    });
  });
  root.querySelectorAll('[data-link]').forEach(el => {
    el.addEventListener('input', () => {
      const i = Number(el.dataset.i);
      S.draft.links[i][el.dataset.link === 't' ? 'title' : 'url'] = el.value;
    });
  });
}

  if (hp && S.panel) { S.panel.text = hp.value; return; }
  const el = e.target.closest('[data-m]');

document.addEventListener('change', e => {
  const el = e.target.closest('[data-m]');
  if (!el || !S.modal) return;
  S.modal.v[el.dataset.m] = el.value;
  if (el.type === 'radio') render();
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, g = id ? goalById(id) : (S.modal ? goalById(S.modal.goalId) : null);
  const m = S.modal;

  switch (act) {
  case 'scrim': if (e.target === t) closeModal(); return;
  case 'mclose': closeModal(); return;
  case 'back': S.view = 'map'; render(); return;
  case 'toggle': S.expanded = S.expanded === id ? null : id; render(); return;

  case 'add': S.draft = blankDraft(); S.view = 'create'; render(); return;
  case 'edit': {
    if (!g) return;
    if (g.translated) { toast('Транслированную цель редактировать нельзя — измените родительскую', 'dan'); return; }
    S.draft = Object.assign(blankDraft(), {
      title:g.title, dos:g.dos, dod:g.dod, type:g.type, plan:g.plan, unit:g.unit, scale:g.scale,
      weight:String(g.weight), period:g.period, priorities:g.priorities.slice(), inverse:g.inverse,
      confidential:g.confidential, links:g.links.map(l => ({...l})), isX:g.isX, editingId:g.id, touched:{}});
    S.view = 'create'; render(); return;
  }
  case 'scenario': applyScenario(t.dataset.s); render(); return;

  case 'accept': openModal('accept', {goalId: id}); return;
  case 'accept-ok': {
    const me = g.participants.find(p => p.id === 'me');
    if ((m.v.mode || 'proposed') === 'custom') {
      const w = num(m.v.w);
      if (isNaN(w)) { m.err = 'Доступен ввод только цифр'; render(); return; }
      if (w < RULES.xWeightMin) { m.err = `Минимальный вес кросс-цели — ${RULES.xWeightMin}%`; render(); return; }
      if (w > RULES.weightMax) { m.err = `Максимальный вес — ${RULES.weightMax}%`; render(); return; }
      const others = S.goals.filter(x => x.id !== m.goalId).reduce((a, x) => a + Number(x.weight || 0), 0);
      if (others + w > RULES.cardTotal) { m.err = `Общий вес карты целей будет ${others + w}%. Свободно ${RULES.cardTotal - others}%`; render(); return; }
      g.weight = w; if (me) me.weight = w;
    }
    g.status = 'accepted';
    if (me) me.status = 'accepted';
    log(`Участие в кросс-цели принято, вес ${g.weight}%`);
    closeModal(); toast('Вы приняли участие в кросс-цели', 'ok'); return;
  }
  case 'decline': openModal('decline', {goalId: id}); return;
  case 'decline-ok': {
    const reason = (m.v.reason || '').trim();
    if (!reason) { m.err = 'Укажите причину отказа — комментарий обязателен'; render(); return; }
    S.goals = S.goals.filter(x => x.id !== m.goalId);
    if (S.expanded === m.goalId) S.expanded = null;
    log(`Участие в кросс-цели отклонено: «${reason.slice(0, 60)}»`);
    closeModal(); toast('Вы отклонили участие в кросс-цели', 'dan'); return;
  }
  case 'myweight': {
    const me = g.participants.find(p => p.id === 'me');
    S.modal = {type: 'myweight', goalId: id, v: {w: String(me ? me.weight : g.weight)}};
    render(); return;
  }
  case 'myweight-ok': {
    const w = num(m.v.w);
    if (isNaN(w)) { m.err = 'Доступен ввод только цифр'; render(); return; }
    if (w < RULES.xWeightMin) { m.err = `Минимальный вес кросс-цели — ${RULES.xWeightMin}%`; render(); return; }
    if (w > RULES.weightMax) { m.err = `Максимальный вес — ${RULES.weightMax}%`; render(); return; }
    const others = S.goals.filter(x => x.id !== m.goalId).reduce((a, x) => a + Number(x.weight || 0), 0);
    if (others + w > RULES.cardTotal) { m.err = `Общий вес карты целей будет ${others + w}%. Свободно ${RULES.cardTotal - others}%`; render(); return; }
    g.weight = w;
    const me = g.participants.find(p => p.id === 'me');
    if (me) me.weight = w;
    log(`Свой вес в кросс-цели изменён на ${w}%`);
    closeModal(); toast('Вес изменён, владельцу отправлено уведомление', 'ok'); return;
  }

  case 'hopen': S.panel = {filter: 'all', text: ''}; render(); return;
  case 'hclose': S.panel = null; render(); return;
  case 'hfilter': S.panel.filter = t.dataset.f; render(); return;
  case 'comment-add': {
    const txt = (S.panel.text || '').trim();
    if (!txt) return;
    S.comments.unshift({t: nowT(), text: txt, kind: 'comment', n: ++S.seq});
    S.panel.text = '';
    render(); return;
  }
  case 'savecollapse': S.expanded = null; log(`Цель «${g.title.slice(0,40)}…» сохранена`); toast('Изменения сохранены', 'ok'); render(); return;
  case 'cancelform': S.view = 'map'; S.draft = null; render(); return;
  case 'saveform': {
    const d = S.draft, err = errorsFor(d);
    if (Object.keys(err).length) {
      d.showAll = true; render();
      const first = document.querySelector('.field.bad');
      if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
      toast('Заполни обязательные поля — система подсветила ошибки', 'dan');
      return;
    }
    if (d.editingId) {
      const t = goalById(d.editingId);
      Object.assign(t, {title:d.title, dos:d.dos, dod:d.dod, type:d.type, plan:d.plan, unit:d.unit,
        scale:d.scale, weight:Number(d.weight), period:d.period, priorities:d.priorities,
        inverse:d.inverse, confidential:d.confidential, links:d.links.filter(l => l.title && l.url)});
      log(`Изменена цель «${t.title.slice(0,40)}…»`);
      toast('Цель сохранена', 'ok');
    } else {
      const g2 = {id:uid(), title:d.title, dos:d.dos, dod:d.dod, type:d.type, plan:d.plan, unit:d.unit,
        scale:d.scale, weight:Number(d.weight), period:d.period, priorities:d.priorities, inverse:d.inverse,
        confidential:d.confidential, isX:false, owner:null, participants:[], parent:null, cascaded:[],
        translated:false, links:d.links.filter(l => l.title && l.url)};
      S.goals.push(g2);
      log(`Создана цель «${g2.title.slice(0,40)}…», вес ${g2.weight}%`);
      toast('Цель создана', 'ok');
    }
    S.view = 'map'; S.draft = null; render(); return;
  }
  case 'flink-add': {
    if (S.draft.links.length >= RULES.linksMax) { S.draft.linkErr = `Нельзя добавить больше ${RULES.linksMax} ссылок`; render(); return; }
    S.draft.linkErr = ''; S.draft.links.push({title:'', url:''}); render(); return;
  }
  case 'flink-del': S.draft.links.splice(Number(t.dataset.i), 1); S.draft.linkErr = ''; render(); return;

  case 'del': {
    const i = S.goals.findIndex(x => x.id === id);
    S.lastDel = {goal: S.goals[i], i};
    S.goals.splice(i, 1);
    if (S.expanded === id) S.expanded = null;
    log(`Удалена цель «${S.lastDel.goal.title.slice(0,40)}…»`);
    toast('Цель удалена', 'dan', true);
    render(); return;
  }
  case 'linkedit': S.linkEdit = S.linkEdit === id ? null : id; render(); return;
  case 'toast-close': S.toasts = S.toasts.filter(x => x.id !== t.dataset.id); render(); return;
  case 'undo': {
    if (S.lastDel) { S.goals.splice(S.lastDel.i, 0, S.lastDel.goal); log('Удаление отменено'); S.lastDel = null; }
    S.toasts = S.toasts.filter(x => x.id !== t.dataset.id);
    render(); return;
  }
  case 'send': {
    if (totalWeight() !== 100) return;
    log('Карта целей отправлена на согласование');
    toast('Карта целей отправлена на согласование', 'ok'); return;
  }

  case 'invite': openModal('invite', {goalId:id}); return;
  case 'invite-ok': {
    const who = COLLEAGUES.find(c => c.id === m.v.who);
    const w = num(m.v.w);
    if (!who) { m.err = 'Выбери коллегу'; render(); return; }
    if (isNaN(w)) { m.err = 'Доступен ввод только цифр'; render(); return; }
    if (w < RULES.xWeightMin) { m.err = `Минимальный вес — ${RULES.xWeightMin}%`; render(); return; }
    if (w > RULES.inviteWeightMax) { m.err = `Максимальный вес — ${RULES.inviteWeightMax}%`; render(); return; }
    if (!(m.v.dod !== undefined ? m.v.dod : g.dod).trim()) { m.err = 'Заполни план действий для участника'; render(); return; }
    if (!g.isX) {
      g.isX = true;
      g.owner = {id:'me', name:'Петрова Карина', pos:'Руководитель', weight:g.weight};
      if (g.confidential) { g.confidential = false; toast('Признак «Конфиденциально» снят: в кросс-цели он недоступен'); }
    }
    g.participants.push({id:who.id, name:who.name, pos:who.pos, weight:w, status:'pending'});
    log(`${who.name} приглашён(а) в кросс-цель с весом ${w}%`);
    closeModal(); toast(`Приглашение отправлено: ${who.name}`, 'ok'); return;
  }

  case 'cascade': openModal('cascade', {goalId:id}); return;
  case 'cascade-next': {
    if (!m.v.method) { m.err = 'Выбери метод каскадирования'; render(); return; }
    const src = goalById(m.goalId);
    S.cform = {goalId: m.goalId, method: m.v.method, who: [], title: src.title, dos: src.dos, dod: src.dod,
      weight: '50', period: src.period, type: src.type, inverse: src.inverse, plan: src.plan, unit: src.unit,
      links: [], err: '', errText: ''};
    S.modal = null; S.view = 'cascade'; render(); return;
  }
  case 'cform-cancel': S.view = 'map'; S.cform = null; render(); return;
  case 'cform-rm': S.cform.who = S.cform.who.filter(x => x !== t.dataset.w); render(); return;
  case 'cform-link': S.cform.links.push({url: '', title: ''}); render(); return;
  case 'cform-link-rm': S.cform.links.splice(Number(t.dataset.i), 1); render(); return;
  case 'cform-ok': {
    const c = S.cform, gg = goalById(c.goalId);
    c.err = ''; c.errText = '';
    if (!c.who.length) { c.err = 'who'; render(); return; }
    if (!c.dod.trim()) { c.err = 'dod'; render(); return; }
    const w = num(c.weight);
    if (isNaN(w) || w < RULES.weightMin || w > RULES.weightMax) {
      c.err = 'weight'; c.errText = `Вес должен быть от ${RULES.weightMin}% до ${RULES.weightMax}%`; render(); return;
    }
    const method = c.method === 'translate' ? 'Трансляция' : 'Декомпозиция';
    for (const id of c.who) {
      const s = SUBORDINATES.find(x => x.id === id);
      gg.cascaded.push({id: uid(), to: s.name, method, weight: w});
      log(`${method}: цель каскадирована на ${s.name}, вес ${w}%`);
    }
    S.view = 'map'; S.cform = null;
    toast(c.method === 'translate' ? 'Цель успешно транслирована' : 'Цель успешно декомпозирована', 'ok');
    return;
  }
  case 'cascade-ok': {
    const who = SUBORDINATES.find(s => s.id === m.v.who);
    const w = num(m.v.w);
    if (!who) { m.err = 'Выбери сотрудника'; render(); return; }
    if (!(m.v.dod || '').trim()) { m.err = 'Заполни DoD — при каскадировании его заполняет каскадирующий'; render(); return; }
    if (isNaN(w) || w < RULES.weightMin || w > RULES.weightMax) { m.err = `Вес должен быть от ${RULES.weightMin}% до ${RULES.weightMax}%`; render(); return; }
    const method = m.method === 'translate' ? 'Трансляция' : 'Декомпозиция';
    g.cascaded.push({id:uid(), to:who.name, method, weight:w});
    log(`${method}: цель каскадирована на ${who.name}, вес ${w}%`);
    closeModal();
    toast(`Цель ${m.method === 'translate' ? 'транслирована' : 'декомпозирована'}: ${who.name}`, 'ok'); return;
  }
  case 'cascadelist': openModal('cascadeList', {goalId:id}); return;
  case 'uncascade': {
    const gg = goalById(t.dataset.id);
    const c = gg.cascaded.find(x => x.id === t.dataset.c);
    gg.cascaded = gg.cascaded.filter(x => x.id !== t.dataset.c);
    log(`Отменено каскадирование на ${c.to}`);
    toast(`Каскадирование на ${c.to} отменено`, 'dan');
    if (!gg.cascaded.length) closeModal(); else render();
    return;
  }

  case 'link': openModal('link', {goalId:id}); return;
  case 'link-ok': {
    if (!m.v.goal) { m.err = 'Выбери цель руководителя'; render(); return; }
    g.parent = m.v.goal;
    log(`Цель связана с целью руководителя «${m.v.goal.slice(0,40)}…»`);
    closeModal(); toast('Цель связана. Связка подтвердится при согласовании карты целей', 'ok'); return;
  }
  case 'unlink': openModal('unlink', {goalId:id}); return;
  case 'unlink-ok': {
    log(`Разорвана связь с целью руководителя «${String(g.parent).slice(0,40)}…»`);
    g.parent = null; closeModal(); toast('Связь разорвана, цель стала самостоятельной', 'dan'); return;
  }

  case 'exclude': openModal('exclude', {goalId:id, pid:t.dataset.p}); return;
  case 'exclude-ok': {
    const p = g.participants.find(x => x.id === m.pid);
    g.participants = g.participants.filter(x => x.id !== m.pid);
    if (!g.participants.length) { g.isX = false; g.owner = null; }
    log(`${p.name} исключён(а) из кросс-цели`);
    closeModal(); toast(`${p.name} исключён(а) из кросс-цели`, 'dan'); return;
  }
  case 'transfer': openModal('transfer', {goalId:id}); return;
  case 'transfer-ok': {
    if (!m.v.who) { m.err = 'Выбери нового владельца'; render(); return; }
    const np = g.participants.find(x => x.id === m.v.who);
    // по макету: цель уходит в карту нового владельца и удаляется из карты прежнего
    S.goals = S.goals.filter(x => x.id !== g.id);
    if (S.expanded === g.id) S.expanded = null;
    log(`Владение кросс-целью передано ${np.name}, цель удалена из вашей карты`);
    closeModal(); toast(`Владение передано: ${np.name}. Цель удалена из вашей карты целей`, 'ok'); return;
  }

  case 'addlink': {
    const gg = goalById(id);
    if (gg.links.length >= RULES.linksMax) { toast(`Нельзя добавить больше ${RULES.linksMax} ссылок`, 'dan'); return; }
    openModal('addlink', {goalId:id}); return;
  }
  case 'addlink-ok': {
    if (!(m.v.t || '').trim() || !(m.v.u || '').trim()) { m.err = 'Заполни название и ссылку'; render(); return; }
    g.links.push({title:m.v.t, url:m.v.u});
    log('Добавлена ссылка во вложения');
    closeModal(); toast('Ссылка добавлена', 'ok'); return;
  }
  case 'rmlink': {
    const gg = goalById(id);
    gg.links.splice(Number(t.dataset.i), 1);
    log('Удалена ссылка из вложений');
    render(); return;
  }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.modal) closeModal(); else if (S.panel) { S.panel = null; render(); }
});

applyScenario(initialScenario());
render();
</script>
</body>
</html>
